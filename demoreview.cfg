//demoreview cfg v1.7 - 20260925 - requires associated autoexec to work

exec "autoexec.cfg" //reset settings to autoexec defaults before loading secondary config

volume "0.05"
cl_demo_predict "1"

bind "KP_ENTER" "toggle spec_show_xray 0 1"
bind "KP_DEL" "demo_togglepause"
bind "KP_PLUS" "demo_timescale 1; alias demo_speed_slomo_cycle speed_setting_1" //reset to 1x speed and reset cycle
bind "KP_MINUS" "demo_speed_slomo_cycle"
bind "KP_0" "spec_player 10" // player 10 is 0 on radar
bind "KP_1" "spec_player 1"
bind "KP_2" "spec_player 2"
bind "KP_3" "spec_player 3"
bind "KP_4" "spec_player 4"
bind "KP_5" "spec_player 5"
bind "KP_6" "spec_player 6"
bind "KP_7" "spec_player 7"
bind "KP_8" "spec_player 8"
bind "KP_9" "spec_player 9"

//ALIAS DEMO SPEED SLOMO CYCLE
alias "demo_speed_slomo_cycle" "speed_setting_1"
alias "speed_setting_1" "demo_timescale 0.25; alias demo_speed_slomo_cycle speed_setting_2"
alias "speed_setting_2" "demo_timescale 0.1; alias demo_speed_slomo_cycle speed_setting_3"
alias "speed_setting_3" "demo_timescale 0.5; alias demo_speed_slomo_cycle speed_setting_1"

echo "demoreview.cfg loaded"
